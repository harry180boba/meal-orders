<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蘭嶼六大部落 · 景點美食地圖</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ocean:#0a3d5c;--teal:#0d7a5f;--sand:#f3ede4;--white:#fff;
  --text:#1c1c1c;--muted:#6a6a6a;--border:#e0d8ce;--panel:#faf7f3;
}
html,body{height:100%;overflow:hidden;font-family:'Noto Sans TC',sans-serif;background:var(--sand);color:var(--text)}

/* TOP BAR */
.topbar{
  background:linear-gradient(135deg,#062d45,#0a3d5c 60%,#0d5c45);
  padding:10px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0;
  box-shadow:0 2px 12px rgba(0,0,0,.25)
}
.topbar-title{font-family:'Noto Serif TC',serif;font-size:17px;color:#fff;font-weight:700;letter-spacing:1px;white-space:nowrap}
.topbar-sub{font-size:11px;color:rgba(255,255,255,.5);letter-spacing:2px;white-space:nowrap}

/* TABS */
.tribe-tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:9px 14px;background:var(--white);border-bottom:1px solid var(--border);flex-shrink:0}
.tribe-tabs::-webkit-scrollbar{display:none}
.tribe-tab{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:12.5px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--muted);transition:all .15s;white-space:nowrap;user-select:none}
.tribe-tab:hover{background:var(--sand)}
.tribe-tab.active{color:#fff;border-color:transparent}

/* LAYOUT */
.main{display:flex;flex:1;overflow:hidden;height:calc(100vh - 91px)}

/* SIDEBAR */
.sidebar{width:270px;min-width:270px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--panel)}
.panel-header{padding:10px 14px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.panel-label{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.panel-count{font-size:20px;font-weight:500;color:var(--ocean)}
.spot-list{flex:1;overflow-y:auto;padding:6px}
.spot-list::-webkit-scrollbar{width:4px}
.spot-list::-webkit-scrollbar-track{background:transparent}
.spot-list::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
.tribe-sep{font-size:10.5px;font-weight:500;padding:10px 10px 3px;letter-spacing:.5px;display:flex;align-items:center;gap:5px}
.spot-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;border:1.5px solid transparent;margin-bottom:2px;transition:all .15s}
.spot-item:hover{background:var(--sand)}
.spot-item.active{background:var(--white);border-color:var(--ocean);box-shadow:0 2px 8px rgba(10,61,92,.1)}
.spot-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.spot-dot.square{border-radius:3px;width:9px;height:9px}
.spot-name{font-size:12.5px;font-weight:500;color:var(--text);line-height:1.3}
.spot-tag{font-size:10px;padding:1px 6px;border-radius:6px;margin-top:3px;display:inline-block;font-weight:500}

/* MAP */
.map-wrap{flex:1;position:relative}
#map{width:100%;height:100%}

/* DETAIL PANEL */
.detail-panel{
  width:0;min-width:0;background:var(--white);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;transition:width .25s ease;flex-shrink:0
}
.detail-panel.open{width:260px;min-width:260px}
.detail-close{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;border:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:10}
.detail-img-wrap{position:relative;flex-shrink:0}
.detail-img{width:100%;height:150px;object-fit:cover;display:block}
.detail-img-ph{width:100%;height:150px;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,#c5ddd6,#9cc8bb);flex-shrink:0}
.detail-body{padding:14px 16px;flex:1;overflow-y:auto}
.detail-badge{font-size:11px;padding:3px 10px;border-radius:10px;font-weight:500;display:inline-block;margin-bottom:8px}
.detail-name{font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.3}
.detail-rating{font-size:12px;color:#9a7200;margin-bottom:10px}
.detail-desc{font-size:12.5px;color:var(--muted);line-height:1.8;margin-bottom:10px}
.detail-tip{background:var(--sand);border-radius:8px;padding:9px 11px;font-size:12px;font-weight:500;margin-bottom:12px;border-left:3px solid var(--teal);color:#1a5c47}
.detail-hours{font-size:11.5px;color:var(--muted);margin-bottom:12px}
.btn-primary{display:block;text-align:center;padding:9px;border-radius:9px;font-size:13px;font-weight:500;color:#fff;text-decoration:none;margin-bottom:6px;cursor:pointer;border:none;width:100%;font-family:inherit}
.btn-secondary{display:block;text-align:center;padding:8px;border-radius:9px;font-size:12.5px;font-weight:500;text-decoration:none;margin-bottom:6px;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--text);width:100%;font-family:inherit}

/* POPUP */
.leaflet-popup-content-wrapper{border-radius:10px!important;box-shadow:0 4px 20px rgba(0,0,0,.18)!important;padding:0!important;overflow:hidden}
.leaflet-popup-content{margin:0!important;width:0!important;height:0!important;overflow:hidden!important;display:none!important}
.leaflet-popup-tip-container{display:none}
.leaflet-popup-content-wrapper{cursor:pointer}

/* LEGEND */
.legend{position:absolute;bottom:20px;right:16px;background:rgba(255,255,255,.95);border-radius:12px;padding:10px 14px;z-index:900;box-shadow:0 2px 12px rgba(0,0,0,.12);font-size:11.5px;backdrop-filter:blur(4px)}
.legend-title{font-weight:500;color:var(--ocean);margin-bottom:7px;font-size:11px;letter-spacing:.5px}
.legend-item{display:flex;align-items:center;gap:7px;margin-bottom:4px;color:var(--text);font-size:11px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-sq{width:10px;height:10px;border-radius:3px;flex-shrink:0}

/* MOBILE */
@media(max-width:700px){
  .sidebar{display:none}
  .detail-panel.open{width:100%;position:absolute;bottom:0;left:0;z-index:1000;height:60%;border-radius:16px 16px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.15)}
}
</style>
</head>

      <div class="legend-item"><div class="legend-sq" style="background:#AD1457"></div>📸 IG打卡</div>
      <div class="legend-item"><div class="legend-sq" style="background:#5D4037"></div>🍽 美食</div>

  <div class="detail-panel" id="detailPanel">

      <button class="detail-close" onclick="closeDetail()">✕</button>

    <div class="detail-body">
      <span class="detail-badge" id="detailBadge"></span>
      <div class="detail-name" id="detailName"></div>

</div>

  // 東清

  {id:'dq2',t:'dongqing',n:'軍艦岩',tag:'地形',r:4.6,rc:113,d:'形似軍艦的壯觀礁岩，是蘭嶼最具氣勢的地形奇觀之一。',tip:'位於東清北方海岸',lat:22.0790,lng:121.5796,url:'https://maps.google.com/?cid=15844536729599641507',img:'https://lh3.googleusercontent.com/place-photos/AJRVUZMrp4UGX4fKkV7W70hhbz-9S8GZFq0-ypyan4gbnAhOje2chOvghFzdIFg59PcZGUonlsAx5YSVuNHTX8bwM6Lj-XlsU_iUcUUkQXye_kI383u0fxxBZBt13x-LWWMBCOdJaWuIYj4uqp6Lqw=s600'},
  {id:'dq3',t:'dongqing',n:'情人洞',tag:'地形',r:4.6,rc:1117,d:'海蝕洞穿透礁岩，穿越洞口可見湛藍大海，充滿浪漫感的自然奇景。',tip:'漲潮時請勿進入',lat:22.0619,lng:121.5733,url:'https://maps.google.com/?cid=3870986719226763316',img:'https://lh3.googleusercontent.com/place-photos/AJRVUZOQj4ItKaZfJrapX4_3NzessyVYOHkJx2hgLtEAffpLw4CE1SPu8Fp1KZVBbXFb0uilii99XflrOfXqg_ok5uhBuWaaB0B8XIJ6DbzuwReSV-W29-8uUCJ0lgdN4jIDws17b83f0R38g1n_zQ=s600'},

  // 野銀

  // IG打卡

  {id:'ig2',t:'ig',n:'舊蘭嶼燈塔（小燈塔）',tag:'IG熱門',r:4.5,rc:210,d:'白色小燈塔矗立礁石上，背景是湛藍大海與開元港，怎麼拍都好看，下船即達。',tip:'椰油開元港旁，步行 3 分鐘',lat:22.0612,lng:121.5040,url:'https://maps.google.com/maps?q=舊蘭嶼燈塔',img:''},

  {id:'ig4',t:'ig',n:'蘭嶼旅人・Rover',tag:'網美酒吧',r:4.6,rc:430,d:'紅頭部落網美系海景酒吧餐廳，坐擁無敵太平洋視角，傍晚喝一杯看夕陽，IG必拍。',tip:'傍晚前往，與青青草原可連排',lat:22.0230,lng:121.5510,url:'https://maps.google.com/maps?q=蘭嶼旅人Rover',img:''},
  // 美食
  {id:'fd1',t:'food',n:'漂流木餐廳',tag:'飛魚料理',r:4.4,rc:380,d:'島上知名餐廳，必點奶油飛魚卵燉飯、整隻炸飛魚，飲品試試「芋仙芋死」和海鹽咖啡。',tip:'11:00–14:00 / 18:00–21:00，週日休',hours:'11:00–14:00｜18:00–21:00（週日休）',lat:22.0565,lng:121.5660,url:'https://maps.google.com/maps?q=漂流木餐廳+蘭嶼',img:''},

  {id:'fd4',t:'food',n:'小七冰店',tag:'海景冰品',r:4.5,rc:178,d:'開元港旁三樓露天座位，視野遼闊，推薦芋頭雪花冰，料多綿密，海景第一排吃冰。',tip:'椰油 7-11 旁樓梯上三樓',hours:'視當日營業為主',lat:22.0588,lng:121.5075,url:'https://maps.google.com/maps?q=小七冰店+蘭嶼',img:''},
  {id:'fd5',t:'food',n:'262 Bar',tag:'飛魚炒飯',r:4.5,rc:156,d:'野銀部落人氣餐廳酒吧，飛魚炒飯數一數二好吃，氛圍輕鬆，島上少見的特色小吧。',tip:'野銀部落，建議提早到',hours:'依當日公告',lat:22.0355,lng:121.5720,url:'https://maps.google.com/maps?q=262bar+蘭嶼',img:''},
  {id:'fd6',t:'food',n:'游麵子',tag:'炸雞排',r:4.4,rc:122,d:'不想吃飛魚？試試手掌大炸雞排，外皮香酥肉厚多汁。5–10 月限定有炸飛魚和炸波波蛋。',tip:'淺粉色磁磚民宅，仔細找',hours:'視當日營業為主',lat:22.0490,lng:121.5140,url:'https://maps.google.com/maps?q=游麵子+蘭嶼',img:''},
  {id:'fd7',t:'food',n:'迦南園',tag:'拼板舟主題',r:4.5,rc:198,d:'外觀兩艘拼板舟造型超吸睛，飛魚滷肉飯、飛魚卵蓋飯，吃飽還可安排文化導覽體驗。',tip:'可搭配文化導覽體驗',hours:'視當日營業為主',lat:22.0235,lng:121.5500,url:'https://maps.google.com/maps?q=迦南園+蘭嶼',img:''},
];

const CENTERS={all:[22.044,121.547,12],dongqing:[22.068,121.570,14],yeyin:[22.035,121.572,14],langdao:[22.080,121.529,14],yeyou:[22.053,121.513,14],yuren:[22.028,121.536,14],hongtou:[22.017,121.565,14],ig:[22.044,121.547,12],food:[22.044,121.547,12]};

let curTribe='all',curId=null,curMapsUrl='';
const markers={};

// MAP
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([22.044,121.547],12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/">CARTO</a>',
  maxZoom:19,subdomains:'abcd'
}).addTo(map);

function makeIcon(t,active){
  const c=TC[t].color;
  const s=active?42:30;
  const isSquare=t==='food'||t==='ig';
  const em=t==='food'?'🍽':t==='ig'?'📸':'';
  let shape;
  if(isSquare){
    shape=`<rect x="4" y="4" width="32" height="32" rx="8" fill="${c}" stroke="white" stroke-width="${active?3:2}" opacity="${active?1:.9}"/>
    <text x="20" y="28" text-anchor="middle" font-size="18" fill="white">${em}</text>`;
  } else {
    shape=`<circle cx="20" cy="20" r="14" fill="${c}" stroke="white" stroke-width="${active?3:2}" opacity="${active?1:.9}"/>
    <circle cx="20" cy="20" r="${active?6:4}" fill="white"/>`;
  }
  return L.divIcon({
    html:`<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 40 40">${shape}</svg>`,
    className:'',iconSize:[s,s],iconAnchor:[s/2,s/2],popupAnchor:[0,-s/2+4]
  });
}

SPOTS.forEach(s=>{
  const m=L.marker([s.lat,s.lng],{icon:makeIcon(s.t,false)}).addTo(map);
  m.on('click',()=>selectSpot(s.id,false));
  markers[s.id]=m;
});

function selectSpot(id,fly=true){
  // reset prev marker
  if(curId&&markers[curId]){
    const prev=SPOTS.find(x=>x.id===curId);
    if(prev) markers[curId].setIcon(makeIcon(prev.t,false));
  }
  curId=id;
  const s=SPOTS.find(x=>x.id===id);
  markers[id].setIcon(makeIcon(s.t,true));
  // sync list
  document.querySelectorAll('.spot-item').forEach(el=>el.classList.remove('active'));
  const li=document.getElementById('li-'+id);
  if(li){li.classList.add('active');li.scrollIntoView({behavior:'smooth',block:'nearest'});}
  // fly map
  if(fly){
    map.flyTo([s.lat,s.lng],15,{animate:true,duration:0.75});
  }
  // open detail panel
  showDetail(s);
}

function showDetail(s){
  const c=TC[s.t];
  // image
  const imgWrap=document.getElementById('detailImgWrap');
  if(s.img){
    imgWrap.innerHTML=`<img class="detail-img" src="${s.img}" alt="${s.n}" onerror="this.outerHTML='<div class=detail-img-ph>${c.emoji}</div>'"><button class="detail-close" onclick="closeDetail()">✕</button>`;
  } else {
    imgWrap.innerHTML=`<div class="detail-img-ph" style="background:linear-gradient(135deg,${c.color}33,${c.color}66)">${c.emoji}</div><button class="detail-close" onclick="closeDetail()">✕</button>`;
  }
  document.getElementById('detailBadge').textContent=c.emoji+' '+c.name;
  document.getElementById('detailBadge').style.cssText=`background:${c.bg};color:${c.text}`;
  document.getElementById('detailName').textContent=s.n;
  document.getElementById('detailRating').textContent=s.r?`⭐ ${s.r}（${s.rc.toLocaleString()} 則評論）`:'';
  document.getElementById('detailDesc').textContent=s.d;
  document.getElementById('detailTip').textContent='💡 '+s.tip;
  document.getElementById('detailHours').textContent=s.hours?'🕐 '+s.hours:'';
  const btn=document.getElementById('detailMapsBtn');
  btn.style.background=c.color;
  curMapsUrl=s.url;
  document.getElementById('detailPanel').classList.add('open');
}

function closeDetail(){
  document.getElementById('detailPanel').classList.remove('open');
  if(curId&&markers[curId]){
    const s=SPOTS.find(x=>x.id===curId);
    if(s) markers[curId].setIcon(makeIcon(s.t,false));
  }
  curId=null;
  document.querySelectorAll('.spot-item').forEach(el=>el.classList.remove('active'));
}

function openMaps(){
  window.open(curMapsUrl,'_blank');
}

// TABS
const TRIBE_ORDER=['dongqing','yeyin','langdao','yeyou','yuren','hongtou','ig','food'];
document.getElementById('tribeTabs').addEventListener('click',e=>{
  const tab=e.target.closest('.tribe-tab');
  if(!tab) return;
  curTribe=tab.dataset.tribe;
  closeDetail();
  document.querySelectorAll('.tribe-tab').forEach(t=>{
    t.classList.remove('active');
    t.style.background='';t.style.color='';t.style.borderColor='';
  });
  tab.classList.add('active');
  if(curTribe!=='all'){
    tab.style.background=TC[curTribe]?.color||'#555';
    tab.style.color='#fff';
    tab.style.borderColor='transparent';
  }
  SPOTS.forEach(s=>{
    if(curTribe==='all'||s.t===curTribe) map.addLayer(markers[s.id]);
    else map.removeLayer(markers[s.id]);
  });
  const[la,ln,z]=CENTERS[curTribe]||CENTERS.all;
  map.flyTo([la,ln],z,{animate:true,duration:0.65});
  renderList();
});

function renderList(){
  const filtered=curTribe==='all'?SPOTS:SPOTS.filter(s=>s.t===curTribe);
  document.getElementById('spotCount').textContent=filtered.length+' 個';
  const el=document.getElementById('spotList');el.innerHTML='';
  const groups={};
  filtered.forEach(s=>(groups[s.t]=groups[s.t]||[]).push(s));
  const order=curTribe==='all'?TRIBE_ORDER:[curTribe];
  order.forEach(tk=>{
    if(!groups[tk]) return;
    if(curTribe==='all'){
      const sep=document.createElement('div');
      sep.className='tribe-sep';sep.style.color=TC[tk].color;
      sep.innerHTML=`<span>${TC[tk].emoji}</span><span>${TC[tk].name}</span>`;
      el.appendChild(sep);
    }
    groups[tk].forEach(s=>{
      const isSquare=s.t==='food'||s.t==='ig';
      const item=document.createElement('div');
      item.className='spot-item'+(curId===s.id?' active':'');
      item.id='li-'+s.id;
      item.innerHTML=`<div class="spot-dot${isSquare?' square':''}" style="background:${TC[s.t].color}"></div>
        <div><div class="spot-name">${s.n}</div>
        <span class="spot-tag" style="background:${TC[s.t].bg};color:${TC[s.t].text}">${s.tag}</span></div>`;
      item.onclick=()=>selectSpot(s.id);
      el.appendChild(item);
    });
  });
}

renderList();
</script>
